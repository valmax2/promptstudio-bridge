name: Build Padel App AAB (release firmato)

# Compila l'Android App Bundle FIRMATO per Google Play. Solo su richiesta
# manuale (mai in automatico), perché usa la chiave di firma reale.
# Richiede questi Secrets del repository (Settings → Secrets and variables →
# Actions): PADEL_KEYSTORE_BASE64, PADEL_KEYSTORE_PASSWORD, PADEL_KEY_ALIAS,
# PADEL_KEY_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (intero, deve aumentare ad ogni upload su Play)'
        required: true
        default: '1'
      version_name:
        description: 'versionName (es. 1.0.0)'
        required: true
        default: '1.0.0'
      upload_to_play:
        description: 'Carica anche su Play Console come BOZZA in Produzione (serve il Secret PLAY_SERVICE_ACCOUNT_JSON). Il click "Invia per la revisione" resta manuale.'
        type: boolean
        required: false
        default: false
      release_notes_it:
        description: 'Note di rilascio in italiano (max 500 caratteri), usate solo se carichi su Play'
        required: false
        default: ''

# Upload su Play: usa il Secret PLAY_SERVICE_ACCOUNT_JSON (chiave JSON di un
# service account Google con permesso di rilascio sull'app in Play Console).
# La release viene creata con status "draft": NON viene mai pubblicata da qui.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Imposta JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Imposta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa e configura l'Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Il default di questa versione dell'azione prova a installare
          # anche il pacchetto "tools" (legacy), che Google ha tolto dal
          # repository SDK - senza questo override lo step fallisce subito
          # con "Failed to find package 'tools'" prima ancora di arrivare
          # allo step sotto, che installa comunque quello che serve davvero.
          packages: 'platform-tools'

      - name: Installa i pacchetti Android SDK richiesti
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decodifico il keystore dal Secret
        working-directory: padel-app
        run: echo "${{ secrets.PADEL_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Compilo l'AAB firmato
        working-directory: padel-app
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/padel-app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.PADEL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PADEL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PADEL_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: bash build-aab-ci.sh

      - name: Carica l'AAB come artifact (privato, solo per te)
        uses: actions/upload-artifact@v4
        with:
          name: padel-app-release-aab-${{ inputs.version_code }}
          path: padel-app/.capacitor-build-release/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Preparo le note di rilascio per Play
        if: ${{ inputs.upload_to_play }}
        env:
          NOTES_IT: ${{ inputs.release_notes_it }}
        run: |
          mkdir -p whatsnew
          if [ -n "$NOTES_IT" ]; then
            printf '%s' "$NOTES_IT" > whatsnew/whatsnew-it-IT
          fi

      - name: Carico l'AAB su Play Console come BOZZA (Produzione)
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.padelapp.app
          releaseFiles: padel-app/.capacitor-build-release/android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: draft
          releaseName: ${{ inputs.version_code }} (${{ inputs.version_name }})
          whatsNewDirectory: whatsnew

      - name: Rimuovo il keystore decodificato dal runner
        if: always()
        working-directory: padel-app
        run: rm -f release.keystore
